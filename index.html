<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citation Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    .widget {
      position: relative;
      width: 340px;
      padding: 28px 32px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.3),
        0 0 60px rgba(79, 140, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      color: #fff;
      overflow: hidden;
    }

    .widget::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(79, 140, 255, 0.08), transparent 50%);
      pointer-events: none;
    }

    .widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .scholar-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f8cff, #6c5ce7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 12px rgba(79, 140, 255, 0.3);
    }

    .header-text {
      display: flex;
      flex-direction: column;
    }

    .header-text .name {
      font-size: 15px;
      font-weight: 700;
      color: #e8edf5;
      letter-spacing: -0.01em;
    }

    .header-text .subtitle {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 1px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .citation-block {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }

    .citation-count {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #4f8cff 0%, #a78bfa 50%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .citation-label {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: -0.01em;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.02em;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .source-link {
      font-size: 11px;
      color: rgba(79, 140, 255, 0.7);
      text-decoration: none;
      transition: color 0.2s;
    }

    .source-link:hover {
      color: #4f8cff;
    }

    /* Number count-up animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .widget.loaded .citation-count {
      animation: fadeInUp 0.6s ease-out;
    }

    /* Loading skeleton */
    .citation-count.loading {
      width: 120px;
      height: 56px;
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      -webkit-text-fill-color: transparent;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Sparkle decoration */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(167, 139, 250, 0.4);
      z-index: 0;
    }

    .sparkle:nth-child(1) { top: 15%; right: 15%; width: 3px; height: 3px; animation: twinkle 3s ease-in-out infinite; }
    .sparkle:nth-child(2) { top: 40%; right: 8%; width: 2px; height: 2px; animation: twinkle 4s ease-in-out 1s infinite; }
    .sparkle:nth-child(3) { bottom: 25%; right: 20%; width: 3px; height: 3px; animation: twinkle 3.5s ease-in-out 0.5s infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <!-- Decorative sparkles -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <div class="widget-header">
      <div class="scholar-icon">🎓</div>
      <div class="header-text">
        <span class="name">Cinay Dilibal</span>
        <span class="subtitle">Google Scholar</span>
      </div>
    </div>

    <div class="citation-block">
      <div class="citation-count loading" id="count"></div>
      <span class="citation-label">citations</span>
    </div>

    <div class="footer">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>Live from GitHub</span>
      </div>
      <a class="source-link" href="https://github.com/Cdilibal/fetch-citations" target="_blank">View source →</a>
    </div>
  </div>

  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/Cdilibal/fetch-citations/main/citations.json';

    async function fetchCitations() {
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        const data = await res.json();
        return data.citations;
      } catch (err) {
        console.error('Failed to fetch citations:', err);
        return null;
      }
    }

    function animateCount(el, target, duration = 1200) {
      const start = 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Ease out cubic
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(start + (target - start) * eased);

        el.textContent = current.toLocaleString();

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }

    async function init() {
      const countEl = document.getElementById('count');
      const widget = document.getElementById('widget');

      const citations = await fetchCitations();

      if (citations !== null) {
        countEl.classList.remove('loading');
        widget.classList.add('loaded');
        animateCount(countEl, citations);
      } else {
        countEl.classList.remove('loading');
        countEl.textContent = '—';
      }
    }

    init();
  </script>
</body>
</html>
